# Local Postgres for development. Production uses Supabase.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kaushalsetu
    ports:
      - "5432:5432"
    volumes:
      - kaushalsetu-db:/var/lib/postgresql/data
volumes:
  kaushalsetu-db:
