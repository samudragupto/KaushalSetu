name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaushalsetu
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kaushalsetu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Typecheck (shared, api, web)
        run: npm run typecheck
      - name: Build API and web
        run: npm run build
        env:
          VITE_API_URL: https://kaushalsetu-api-wzll.onrender.com
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist
          retention-days: 3

  e2e:
    name: Migrate, seed and smoke test
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kaushalsetu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaushalsetu
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kaushalsetu
      JWT_SECRET: ci-only-secret-0123456789abcdef
      CORS_ORIGIN: http://localhost:5173
      PUBLIC_WEB_URL: http://localhost:5173
      DEMO_MODE: "true"
      CRON_ENABLED: "false"
      PORT: "4000"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install (including dev tools, as on Render)
        run: npm ci --include=dev
      - name: Build API
        run: npm run build -w @kaushalsetu/api
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Check migrations match the schema (no drift)
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Seed (deterministic, seed sih26135)
        run: npm run db:seed
      - name: Start API
        run: |
          node apps/api/dist/server.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && exit 0
            sleep 1
          done
          cat api.log
          exit 1
      - name: Smoke test the demo path
        run: node scripts/smoke.mjs
        env:
          API_URL: http://localhost:4000
          WEB_ORIGIN: http://localhost:5173
      - name: API log
        if: always()
        run: cat api.log || true

  deploy:
    name: Deploy API and check production
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      API_URL: https://kaushalsetu-api-wzll.onrender.com
      WEB_URL: https://kaushalsetu-zeta.vercel.app
    steps:
      - name: Trigger Render deploy (when a deploy hook secret is configured)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -sf -X POST "$RENDER_DEPLOY_HOOK" && echo "Render deploy triggered"
            sleep 240
          else
            echo "No RENDER_DEPLOY_HOOK secret; Render deploys from its own auto-deploy setting."
          fi
      - name: Production health (waits for a cold start)
        run: |
          for i in $(seq 1 20); do
            if curl -sf -m 60 "$API_URL/health" | grep -q '"db":"ok"'; then echo "API healthy"; exit 0; fi
            sleep 15
          done
          exit 1
      - name: Production CORS allows the Vercel origin
        run: |
          curl -s -i -X OPTIONS "$API_URL/api/analytics/dashboard" \
            -H "Origin: $WEB_URL" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization" \
            | tr -d '\r' | grep -i "access-control-allow-origin: $WEB_URL"
      - name: Web app serves deep links
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' "$WEB_URL/verify/ci-check")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$WEB_URL/sim/whatsapp")" = "200"
